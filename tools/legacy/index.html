<script src="/shared/chrome.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
const IV = new Uint8Array([
  0xd1,0x01,0x29,0x75,0xae,0x2d,0xb2,0xab,
  0x23,0xe2,0x04,0x15,0x0f,0x54,0x97,0xf2
]);

const SBOX = new Uint8Array([
  0x00,0x07,0x0e,0x09,0x1c,0x1b,0x12,0x15,0x38,0x3f,0x36,0x31,0x24,0x23,0x2a,0x2d,
  0x70,0x77,0x7e,0x79,0x6c,0x6b,0x62,0x65,0x48,0x4f,0x46,0x41,0x54,0x53,0x5a,0x5d,
  0xe0,0xe7,0xee,0xe9,0xfc,0xfb,0xf2,0xf5,0xd8,0xdf,0xd6,0xd1,0xc4,0xc3,0xca,0xcd,
  0x90,0x97,0x9e,0x99,0x8c,0x8b,0x82,0x85,0xa8,0xaf,0xa6,0xa1,0xb4,0xb3,0xba,0xbd,
  0xc7,0xc0,0xc9,0xce,0xdb,0xdc,0xd5,0xd2,0xff,0xf8,0xf1,0xf6,0xe3,0xe4,0xed,0xea,
  0xb7,0xb0,0xb9,0xbe,0xab,0xac,0xa5,0xa2,0x8f,0x88,0x81,0x86,0x93,0x94,0x9d,0x9a,
  0x27,0x20,0x29,0x2e,0x3b,0x3c,0x35,0x32,0x1f,0x18,0x11,0x16,0x03,0x04,0x0d,0x0a,
  0x57,0x50,0x59,0x5e,0x4b,0x4c,0x45,0x42,0x6f,0x68,0x61,0x66,0x73,0x74,0x7d,0x7a,
  0x89,0x8e,0x87,0x80,0x95,0x92,0x9b,0x9c,0xb1,0xb6,0xbf,0xb8,0xad,0xaa,0xa3,0xa4,
  0xf9,0xfe,0xf7,0xf0,0xe5,0xe2,0xeb,0xec,0xc1,0xc6,0xcf,0xc8,0xdd,0xda,0xd3,0xd4,
  0x69,0x6e,0x67,0x60,0x75,0x72,0x7b,0x7c,0x51,0x56,0x5f,0x58,0x4d,0x4a,0x43,0x44,
  0x19,0x1e,0x17,0x10,0x05,0x02,0x0b,0x0c,0x21,0x26,0x2f,0x28,0x3d,0x3a,0x33,0x34,
  0x4e,0x49,0x40,0x47,0x52,0x55,0x5c,0x5b,0x76,0x71,0x78,0x7f,0x6a,0x6d,0x64,0x63,
  0x3e,0x39,0x30,0x37,0x22,0x25,0x2c,0x2b,0x06,0x01,0x08,0x0f,0x1a,0x1d,0x14,0x13,
  0xae,0xa9,0xa0,0xa7,0xb2,0xb5,0xbc,0xbb,0x96,0x91,0x98,0x9f,0x8a,0x8d,0x84,0x83,
  0xde,0xd9,0xd0,0xd7,0xc2,0xc5,0xcc,0xcb,0xe6,0xe1,0xe8,0xef,0xfa,0xfd,0xf4,0xf3,
]);

// Precompute MD5 T-table and S-shifts once
const MD5_T = Array.from({length:64}, (_,i) => (Math.abs(Math.sin(i+1)) * 4294967296) >>> 0);
const MD5_S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
               5, 9,14,20,5, 9,14,20,5, 9,14,20,5, 9,14,20,
               4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
               6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];

// ── Helpers ──────────────────────────────────────────────────────────────────
function b64enc(bytes) {
  return btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''));
}
function b64dec(str) {
  try {
    const s = atob(str);
    return Uint8Array.from(s, c => c.charCodeAt(0));
  } catch(e) {
    return null;
  }
}

function reverseBytes32(x) {
  x = x >>> 0;
  return (((x & 0xff) << 24) | (((x >>> 8) & 0xff) << 16) |
          (((x >>> 16) & 0xff) << 8) | (x >>> 24)) >>> 0;
}

// ── Message digest (big-endian word order) ──
function digestCompress(A, B, C, D, M) {
  let a = A, b = B, c = C, d = D;
  for (let i = 0; i < 64; i++) {
    let f, g;
    if      (i < 16) { f = (b & c) | (~b & d); g = i; }
    else if (i < 32) { f = (d & b) | (~d & c); g = (5*i+1) % 16; }
    else if (i < 48) { f = b ^ c ^ d;           g = (3*i+5) % 16; }
    else             { f = c ^ (b | ~d);        g = (7*i) % 16; }
    f = f >>> 0;
    let t = (a + f + M[g] + MD5_T[i]) >>> 0;
    const r = MD5_S[i];
    t = ((t << r) | (t >>> (32 - r))) >>> 0;
    a = d; d = c; c = b;
    b = (b + t) >>> 0;
  }
  return [(A+a)>>>0, (B+b)>>>0, (C+c)>>>0, (D+d)>>>0];
}

function digest(data) {
  const msg = Array.from(data);
  const bitLen = msg.length * 8;
  msg.push(0x80);
  while (msg.length % 64 !== 56) msg.push(0);
  let lo = bitLen >>> 0, hi = Math.floor(bitLen / 0x100000000) >>> 0;
  for (let i=0;i<4;i++){msg.push(lo&0xff);lo>>>=8;}
  for (let i=0;i<4;i++){msg.push(hi&0xff);hi>>>=8;}

  let A=0x67452301, B=0xefcdab89, C=0x98badcfe, D=0x10325476;
  const nB = msg.length / 64;

  for (let bi=0; bi<nB; bi++) {
    const off = bi * 64;
    const M = [];
    for (let j=0;j<16;j++) {
      M.push(((msg[off+j*4]) | (msg[off+j*4+1]<<8) |
              (msg[off+j*4+2]<<16) | (msg[off+j*4+3]<<24)) >>> 0);
    }
    // read words in big-endian order; the final block leaves its last two words native
    const n = (bi < nB-1) ? 16 : 14;
    for (let j=0;j<n;j++) M[j] = reverseBytes32(M[j]);
    [A,B,C,D] = digestCompress(A,B,C,D,M);
  }

  // Write as big-endian
  const out = new Uint8Array(16);
  for (const [i,w] of [[0,A],[4,B],[8,C],[12,D]]) {
    out[i]   = (w>>>24)&0xff; out[i+1] = (w>>>16)&0xff;
    out[i+2] = (w>>>8) &0xff; out[i+3] =  w      &0xff;
  }
  return out;
}

// ── Permutation ──────────────────────────────────────────────────────────────
function permIdx(a, b) {
  if (a > b) return a;
  while (true) {
    if (a === b) a = 0; else a++;
    b--;
    if (a > b) break;
  }
  return a;
}
function permuteB64(s) {
  const src = [...s], len = src.length, dest = new Array(len);
  let out = 0, pick = 1;
  while (out < len) {
    if (pick > len-1) pick = 0;
    dest[out++] = src[permIdx(pick, len-2)];
    pick++;
  }
  return dest.join('');
}

// ── SBOX checksum ────────────────────────────────────────────────────────────
function sboxChk(bytes) {
  let acc = 0;
  for (const b of bytes) acc = SBOX[b ^ acc];
  return acc;
}

// ── CRC-16/CCITT ─────────────────────────────────────────────────────────────
function crc16(data) {
  let crc = 0xffff;
  for (const b of data) {
    crc ^= b;
    for (let i=0;i<8;i++) crc = (crc&1) ? ((crc>>>1)^0x8408) : (crc>>>1);
  }
  return crc & 0xffff;
}

// ── AES-128 CBC via Web Crypto API ────────────────────────────────────────────
async function aesImport(keyStr, usages) {
  return crypto.subtle.importKey(
    'raw', new TextEncoder().encode(keyStr),
    {name:'AES-CBC'}, false, usages
  );
}
async function aesDecrypt(keyStr, cipherBytes) {
  const k = await aesImport(keyStr, ['decrypt']);
  return new Uint8Array(
    await crypto.subtle.decrypt({name:'AES-CBC', iv:IV}, k, cipherBytes)
  );
}
async function aesEncrypt(keyStr, plainBytes) {
  const k = await aesImport(keyStr, ['encrypt']);
  return new Uint8Array(
    await crypto.subtle.encrypt({name:'AES-CBC', iv:IV}, k, plainBytes)
  );
}

// ── Serial generation ─────────────────────────────────────────────────────────
// A serial is a prefix, three numeric groups, and a fixed tail, mixed by several
// digit passes over positions 7..21, then closed with two check digits.
const SUBST = [[0,5,6,3,4,2,9,7,8,1],[4,8,7,0,6,3,2,5,9,1],[7,3,2,5,1,0,9,6,4,8],[1,4,7,8,9,6,3,0,5,2],[4,6,7,9,1,8,2,3,0,5],[4,1,5,2,8,6,9,3,7,0],[2,1,7,8,5,6,9,3,0,4],[4,6,9,2,3,8,7,0,5,1],[2,3,1,4,8,0,7,6,9,5],[3,6,5,4,7,1,9,8,0,2],[6,5,8,3,2,9,7,0,1,4],[7,8,5,1,9,3,4,6,2,0],[8,4,3,7,9,2,5,0,1,6],[0,1,6,2,4,8,9,5,3,7],[4,2,7,8,0,3,6,1,9,5]];
const PREFIX = "11181", TAIL = "0000036";
function pad(n,w){let s=""+n;while(s.length<w)s="0"+s;return s;}

// running sum of adjacent digits, mod 10, from the right
function sumPass(d){for(let i=20;i>=7;i--)d[i]=48+(((d[i]-48)+(d[i+1]-48))%10);}
// per-position digit substitution
function substPass(d){for(let p=0;p<15;p++)d[7+p]=48+SUBST[p][d[7+p]-48];}
// position-dependent scatter of the 15 interior digits
function scatterPass(d){
  let mid=d.slice(7,22);
  for(let pos=0;pos<15;pos++){
    let slots=new Array(14).fill(0), slot=((mid[pos]-48)+pos)%14;
    for(let k=0;k<15;k++){if(k===pos)continue;slots[slot]=mid[k];slot=(slot+1)%14;}
    let next=mid.slice();
    for(let k=0;k<pos;k++)next[k]=slots[k];
    for(let k=0;k<14-pos;k++)next[pos+1+k]=slots[pos+k];
    mid=next;
  }
  for(let i=0;i<15;i++)d[7+i]=mid[i];
}
// progressive left-rotation of the interior
function rotatePass(d){
  for(let span=0;span<14;span++){
    let first=d[7];
    for(let k=0;k<=span;k++)d[7+k]=d[8+k];
    d[8+span]=first;
  }
}
// two trailing check digits over the first 22 digits
function checkDigits(part){
  let c=0xFFFF;
  for(let x of part){c^=x;for(let i=0;i<8;i++)c=(c&1)?((c>>>1)^0x8408):(c>>>1);c&=0xFFFF;}
  c^=0xFFFF; c=(((c&0xFF)<<8)|(c>>>8))&0xFFFF;
  return c%100;
}
function genSerial(){
  const g1 = 10  + Math.floor(Math.random()*90);
  const g2 = 10  + Math.floor(Math.random()*90);
  const g3 = 100 + Math.floor(Math.random()*900);
  const base = PREFIX + pad(g1,2) + pad(g2,5) + pad(g3,3) + TAIL;
  let d = Array.from(base, c => c.charCodeAt(0));
  sumPass(d); scatterPass(d); substPass(d); scatterPass(d); rotatePass(d); substPass(d); sumPass(d);
  const chk = checkDigits(d.slice(0,22));
  const full = d.slice(0,22).map(x => String.fromCharCode(x)).join("") + pad(chk,2);
  return full.match(/.{4}/g).join("-");
}

// ── Activation ─────────────────────────────────────────────────────────────────
async function generateActivation(serial, reqSpaced) {
  const stripped = serial.replace(/-/g,'');
  if (stripped.length !== 24 || !/^\d+$/.test(stripped))
    throw new Error('Serial must be 6 groups of 4 digits (e.g. XXXX-XXXX-XXXX-XXXX-XXXX-XXXX)');

  const key = stripped.slice(8, 24);                 // 16-char key taken from the serial
  const reqCipher = b64dec(reqSpaced.replace(/\s/g,''));
  if (!reqCipher || reqCipher.length % 16 !== 0)
    throw new Error('Request code is not valid base64 or wrong length');

  // recover the request payload and its trailing version tag
  const reqPlain = await aesDecrypt(key, reqCipher);
  if (reqPlain.length < 27)
    throw new Error('Decrypted request too short — wrong serial?');
  const payload = reqPlain.slice(0, 24);
  const version = reqPlain.slice(24, 27);

  // re-encode, permute, and fold the payload back down to 24 bytes
  const mixed = b64dec(permuteB64(b64enc(payload)));
  if (!mixed) throw new Error('internal error');

  // bind payload, serial and version together into a digest
  const material = new Uint8Array(mixed.length + stripped.length + 3);
  material.set(mixed, 0);
  material.set(new TextEncoder().encode(stripped), mixed.length);
  material.set(version, mixed.length + stripped.length);
  const mac = digest(material);

  // response block: digest token, a length marker, and a checksum byte
  const token = b64enc(mac);
  const plain = new Uint8Array(26);
  plain.set(new TextEncoder().encode(token), 0);
  plain[24] = 0x1c;
  plain[25] = sboxChk(plain.slice(0, 25));

  const cipher = await aesEncrypt(key, plain);
  return b64enc(cipher).match(/.{1,4}/g).join(' ');
}

(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  BQChrome.initRipple(".icon-btn, .btn, .bottom-nav__item");
  BQChrome.initTheme();

  async function copy(text, what) {
    if (!text) { BQChrome.snackbar("Nothing to copy yet."); return; }
    try {
      await navigator.clipboard.writeText(text);
      BQChrome.snackbar(what + " copied.");
    } catch (e) {
      BQChrome.snackbar("Couldn't copy — select it and copy manually.");
    }
  }

  $("genSerialBtn").addEventListener("click", () => {
    $("inSerial").value = genSerial();
  });
  $("copySerialBtn").addEventListener("click", () => copy($("inSerial").value.trim(), "Serial"));

  $("genActBtn").addEventListener("click", async () => {
    const btn = $("genActBtn");
    $("errorBanner").classList.add("hidden");
    $("outActivation").value = "";
    btn.disabled = true;
    try {
      $("outActivation").value = await generateActivation($("inSerial").value.trim(), $("inReq").value.trim());
    } catch (e) {
      $("errorBody").textContent = e.message;
      $("errorBanner").classList.remove("hidden");
    } finally {
      btn.disabled = false;
    }
  });
  $("copyActBtn").addEventListener("click", () => copy($("outActivation").value, "Activation code"));

})();
</script>
